server:
  port: 8081
spring:
  application:
    name: book-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/books_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
