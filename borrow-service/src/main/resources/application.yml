server:
  port: 8082
spring:
  application:
    name: borrow-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/borrow_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
book-service:
  url: ${BOOK_SERVICE_URL:http://localhost:8081}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
